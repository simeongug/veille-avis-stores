name: Dates et destinataires d'envoi

on:
  workflow_dispatch:
    inputs:
      event:
        description: "Épreuve"
        type: choice
        required: true
        default: tour-de-france
        options:
          - tour-de-france
          - dakar
          - vuelta
      date_debut:
        description: "Premier jour d'envoi, JJ/MM/AAAA (vide = dates inchangées)"
        required: false
      date_fin:
        description: "Dernier jour d'envoi inclus, JJ/MM/AAAA"
        required: false
      destinataires:
        description: "Destinataires du rapport et des alertes, séparés par des virgules (vide = inchangés)"
        required: false
      desactiver:
        description: "Désactiver les envois automatiques de cette épreuve"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # active ou désactive les envois automatiques

concurrency:
  group: avis-data
  cancel-in-progress: false

jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enregistrer les dates
        env:
          EVENT: ${{ inputs.event }}
          DEBUT: ${{ inputs.date_debut }}
          FIN: ${{ inputs.date_fin }}
          DEST: ${{ inputs.destinataires }}
          OFF: ${{ inputs.desactiver }}
        run: |
          args=()
          [ "$OFF" = "true" ] && args+=(--disable)
          python -m avis_watch.planning --config "config/${EVENT}.yml" --from "$DEBUT" --to "$FIN" --recipients "$DEST" "${args[@]}"
          git config user.name "avis-watch"
          git config user.email "avis-watch@users.noreply.github.com"
          git add config
          git diff --cached --quiet || (git commit -m "config: dates d'envoi de ${EVENT}" && git pull --rebase && git push)
      - name: Activer ou désactiver les envois automatiques
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actifs si au moins une épreuve a une date de fin aujourd'hui ou plus tard ; sinon tout est éteint.
          today=$(TZ=Europe/Paris date +%F); future=false
          for f in config/*.yml; do
            b=$(sed -n 's/^active_to:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
            if [ -n "$b" ] && [[ ! "$today" > "$b" ]]; then future=true; fi
          done
          for wf in alerts.yml daily.yml; do
            if [ "$future" = true ]; then gh workflow enable $wf -R "$GITHUB_REPOSITORY"; else gh workflow disable $wf -R "$GITHUB_REPOSITORY"; fi
          done
          echo "Envois automatiques : $([ "$future" = true ] && echo activés || echo désactivés)"
