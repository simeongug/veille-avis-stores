name: Rapport quotidien

on:
  schedule:
    # GitHub retarde souvent les crons de plusieurs heures (surtout à :00). On déclenche donc plusieurs fois
    # de 07:00 à 11:00 UTC sur des minutes peu chargées : le script n'envoie qu'entre 9 h et 13 h heure de Paris,
    # une seule fois par jour, et seulement dans la fenêtre d'activité (sinon arrêt immédiat, sans coût notable).
    - cron: "7 7 * * *"
    - cron: "23 7 * * *"
    - cron: "41 7 * * *"
    - cron: "7 8 * * *"
    - cron: "23 8 * * *"
    - cron: "41 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Épreuve"
        type: choice
        required: true
        default: tour-de-france
        options:
          - tour-de-france
          - dakar
          - vuelta
      to:
        description: "Destinataire de test (vide = destinataires de la config)"
        required: false
      dry_run:
        description: "Ne rien envoyer (l'email est enregistré dans les artefacts)"
        type: boolean
        default: false
      as_of:
        description: "Rejeu : date et heure de Paris simulées, ex. 05/07/2026 09:00 (vide = maintenant)"
        required: false

permissions:
  contents: write
  actions: write   # pour se désactiver seul une fois la dernière épreuve terminée

concurrency:
  group: avis-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # journal en temps réel

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lancement planifié hors de toute fenêtre d'activité : on s'arrête ici, sans installer Python
      # (économise ~1 min de quota GitHub par passage, soit des centaines de minutes par mois pour les alertes).
      - name: Fenêtre d'activité
        id: win
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            run=false; today=$(TZ=Europe/Paris date +%F)
            for f in config/*.yml; do
              a=$(sed -n 's/^active_from:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
              b=$(sed -n 's/^active_to:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
              if [ -n "$a" ] && [ -n "$b" ] && [[ ! "$today" < "$a" ]] && [[ ! "$today" > "$b" ]]; then run=true; fi
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "Exécution : $run"
          # Plus aucune épreuve en cours ni à venir : le workflow se désactive (zéro passage, zéro minute consommée).
          # Il est réactivé par « Dates et destinataires d'envoi » quand on renseigne les dates d'une épreuve.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            future=false
            for f in config/*.yml; do
              b=$(sed -n 's/^active_to:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
              if [ -n "$b" ] && [[ ! "$today" > "$b" ]]; then future=true; fi
            done
            if [ "$future" = false ]; then echo "Aucune épreuve à venir : désactivation"; gh workflow disable daily.yml -R "$GITHUB_REPOSITORY"; fi
          fi
      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.win.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Rapport
        if: steps.win.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          TO: ${{ inputs.to }}
          CFG: ${{ inputs.event }}
          DRY: ${{ inputs.dry_run }}
          AS_OF: ${{ inputs.as_of }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          args=()
          [ "$EVENT" = "schedule" ] && args+=(--scheduled)
          [ -n "$TO" ] && args+=(--to "$TO")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          # Rejeu : données séparées (data-replay) pour ne pas mélanger avec les vraies données
          [ -n "$AS_OF" ] && args+=(--as-of "$AS_OF" --data-dir data-replay)
          # Lancement planifié : tous les événements de config/ (chacun respecte sa propre fenêtre d'activité).
          # Lancement manuel : l'événement choisi.
          if [ "$EVENT" = "schedule" ]; then files=(config/*.yml); else files=("config/${CFG:-tour-de-france}.yml"); fi
          for f in "${files[@]}"; do
            echo "== $f"; python -m avis_watch.main daily --config "$f" "${args[@]}" || echo "échec pour $f"
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.win.outputs.run == 'true'
        with:
          name: emails
          path: out/
          if-no-files-found: ignore
      - name: Sauvegarder les avis collectés
        if: always() && steps.win.outputs.run == 'true'
        run: |
          git config user.name "avis-watch"
          git config user.email "avis-watch@users.noreply.github.com"
          for d in data data-replay; do if [ -d "$d" ]; then git add "$d"; fi; done
          git diff --cached --quiet || (git commit -m "data: mise à jour des avis" && git pull --rebase && git push)
