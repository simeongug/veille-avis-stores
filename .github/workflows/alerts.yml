name: Alertes

on:
  schedule:
    # deux fois par heure (GitHub saute ou retarde des passages) ; arrêt immédiat hors fenêtre d'activité
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Épreuve"
        type: choice
        required: true
        default: tour-de-france
        options:
          - tour-de-france
          - dakar
          - vuelta
      to:
        description: "Destinataire de test (vide = destinataires de la config)"
        required: false
      dry_run:
        description: "Ne rien envoyer (l'email est enregistré dans les artefacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: avis-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # journal en temps réel

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lancement planifié hors de toute fenêtre d'activité : on s'arrête ici, sans installer Python
      # (économise ~1 min de quota GitHub par passage, soit des centaines de minutes par mois pour les alertes).
      - name: Fenêtre d'activité
        id: win
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            run=false; today=$(TZ=Europe/Paris date +%F)
            for f in config/*.yml; do
              a=$(sed -n 's/^active_from:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
              b=$(sed -n 's/^active_to:[[:space:]]*"\{0,1\}\([0-9-]*\).*/\1/p' "$f")
              if [ -n "$a" ] && [ -n "$b" ] && [[ ! "$today" < "$a" ]] && [[ ! "$today" > "$b" ]]; then run=true; fi
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "Exécution : $run"
      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.win.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Vérifier les seuils
        if: steps.win.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          TO: ${{ inputs.to }}
          CFG: ${{ inputs.event }}
          DRY: ${{ inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          args=()
          [ "$EVENT" = "schedule" ] && args+=(--scheduled)
          [ -n "$TO" ] && args+=(--to "$TO")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          # Lancement planifié : tous les événements de config/ (chacun respecte sa propre fenêtre d'activité).
          # Lancement manuel : l'événement choisi.
          if [ "$EVENT" = "schedule" ]; then files=(config/*.yml); else files=("config/${CFG:-tour-de-france}.yml"); fi
          for f in "${files[@]}"; do
            echo "== $f"; python -m avis_watch.main alert --config "$f" "${args[@]}" || echo "échec pour $f"
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.win.outputs.run == 'true'
        with:
          name: emails
          path: out/
          if-no-files-found: ignore
      - name: Sauvegarder les avis collectés
        if: always() && steps.win.outputs.run == 'true'
        run: |
          git config user.name "avis-watch"
          git config user.email "avis-watch@users.noreply.github.com"
          for d in data data-replay; do if [ -d "$d" ]; then git add "$d"; fi; done
          git diff --cached --quiet || (git commit -m "data: mise à jour des avis" && git pull --rebase && git push)
