# Configuration de l'événement : Tour de France
# Pour un autre événement (Dakar, Vuelta), copier ce fichier et changer les valeurs.

event: tour-de-france
name: Tour de France
timezone: Europe/Paris

# Fenêtre d'activité des envois PLANIFIÉS (rapport de 9 h et alertes).
# Laisser vide = aucun envoi planifié, seuls les lancements manuels fonctionnent.
# Exemple : active_from: 2027-07-02 / active_to: 2027-07-26
active_from:
active_to:

# Calendrier des étapes : sert à préciser l'étape dans le titre de l'email (le rapport porte sur la veille).
# Source : programme officiel publié (à vérifier). Pour un autre événement, remplacer cette liste.
stages:
  - {date: 2026-07-04, stage: 1, route: "Barcelone → Barcelone (contre-la-montre par équipes)"}
  - {date: 2026-07-05, stage: 2, route: "Tarragone → Barcelone"}
  - {date: 2026-07-06, stage: 3, route: "Granollers → Les Angles"}
  - {date: 2026-07-07, stage: 4, route: "Carcassonne → Foix"}
  - {date: 2026-07-08, stage: 5, route: "Lannemezan → Pau"}
  - {date: 2026-07-09, stage: 6, route: "Pau → Gavarnie-Gèdre"}
  - {date: 2026-07-10, stage: 7, route: "Hagetmau → Bordeaux"}
  - {date: 2026-07-11, stage: 8, route: "Périgueux → Bergerac"}
  - {date: 2026-07-12, stage: 9, route: "Malemort → Ussel"}
  - {date: 2026-07-13, rest: "Cantal"}
  - {date: 2026-07-14, stage: 10, route: "Aurillac → Le Lioran"}
  - {date: 2026-07-15, stage: 11, route: "Vichy → Nevers"}
  - {date: 2026-07-16, stage: 12, route: "Magny-Cours → Chalon-sur-Saône"}
  - {date: 2026-07-17, stage: 13, route: "Dole → Belfort"}
  - {date: 2026-07-18, stage: 14, route: "Mulhouse → Le Markstein Fellering"}
  - {date: 2026-07-19, stage: 15, route: "Champagnole → Plateau de Solaison"}
  - {date: 2026-07-20, rest: "Haute-Savoie"}
  - {date: 2026-07-21, stage: 16, route: "Évian-les-Bains → Thonon-les-Bains (contre-la-montre individuel)"}
  - {date: 2026-07-22, stage: 17, route: "Chambéry → Voiron"}
  - {date: 2026-07-23, stage: 18, route: "Voiron → Orcières-Merlette"}
  - {date: 2026-07-24, stage: 19, route: "Gap → Alpe d'Huez"}
  - {date: 2026-07-25, stage: 20, route: "Le Bourg-d'Oisans → Alpe d'Huez"}
  - {date: 2026-07-26, stage: 21, route: "Thoiry → Paris (Champs-Élysées)"}

apps:
  - name: Tour de France
    ios_id: "1528742741"
    android_package: com.aso.tdf2012int

# Pays surveillés : « all » = tous les pays de l'App Store et toutes les langues du Play Store.
# On peut aussi lister des pays : - {country: fr, lang: fr}
markets: all

# Chaque matin, on repasse sur les N derniers jours pour rattraper les avis arrivés en retard.
rescan_days: 14

themes: [carte, direct, classement, notifications, connexion, publicité, bug, contenu, autre]

report:
  recipients: [sguglielmetti@aso.fr]
  min_problem: 3          # nb d'avis négatifs sur un même sujet pour le signaler

alerts:
  recipients: [sguglielmetti@aso.fr]
  window_minutes: 60      # fenêtre de comptage des nouveaux avis
  volume_min: 15          # alerte si au moins N nouveaux avis dans la fenêtre...
  volume_factor: 4        # ...ET au moins N fois le rythme habituel
  rating_below: 3.0       # alerte si la note moyenne récente passe sous ce seuil
  rating_min_reviews: 8
  rating_window_hours: 3
  theme_min: 8            # alerte si N avis négatifs sur le même sujet dans la fenêtre longue
  cooldown_minutes: 180   # pas de renvoi de la même alerte avant ce délai

# Détection d'anomalies (comparaison du jour aux 14 jours précédents, par plateforme)
anomaly:
  min_reviews: 15         # nombre minimum d'avis du jour pour juger la note et la part de négatifs
  volume_min: 15          # volume anormal : au moins N avis...
  volume_factor: 3        # ...et au moins N fois la moyenne habituelle
  rating_low: 3.2         # note du jour jugée anormalement basse en dessous de ce seuil
  rating_drop: 0.6        # ou baisse d'au moins N points vs la moyenne habituelle
  neg_share: 0.4          # part d'avis à 1-2 étoiles jugée anormale
  version_share: 0.7      # une version concentre au moins N % des avis négatifs
  theme_min: 5            # un sujet cumule au moins N avis négatifs...
  theme_factor: 3         # ...et au moins N fois sa moyenne habituelle

# IA : Gemini (niveau gratuit) si le secret GEMINI_API_KEY existe, sinon Claude si ANTHROPIC_API_KEY existe,
# sinon analyse par mots-clés. Les noms de modèles sont à vérifier dans Google AI Studio.
llm:
  min_interval_s: 6       # pause entre deux appels (limites du niveau gratuit)
  recent_days: 3          # seuls les avis des N derniers jours passent par l'IA
models:
  gemini:
    classify: gemini-3.5-flash-lite
    summary: gemini-3.6-flash
    fallbacks: [gemini-3.1-flash-lite, gemini-3.8-flash, gemini-3.6-flash]   # essayés si un modèle est inconnu
  claude: {classify: claude-haiku-5-5, summary: claude-sonnet-5-5}
